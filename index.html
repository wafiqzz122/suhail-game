<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster Shooter - Official Game Site</title>

    <script>
        // Your exact installer filename is already filled in here!
        const GAME_DOWNLOAD_FILE = "suhail-game Setup 1.0.0.exe";
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            background: #141a24;
            border: 1px solid #1f2937;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .tag {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(0, 229, 255, 0.1);
            color: #00e5ff;
            border: 1px solid #00e5ff;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #00e5ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.owner {
            color: #9ca3af;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .description {
            color: #d1d5db;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        .download-btn {
            display: inline-block;
            background: linear-gradient(135deg, #00e5ff, #0088ff);
            color: #000000;
            font-weight: bold;
            font-size: 1.2rem;
            padding: 16px 40px;
            border-radius: 30px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
            cursor: pointer;
            border: none;
        }

        .download-btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.7);
        }

        .info {
            margin-top: 20px;
            color: #6b7280;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="tag">OFFICIAL RELEASE</div>
        <h1>MONSTER SHOOTER</h1>
        <p class="owner">Created & Owned by <strong>Suhail Wafiq</strong></p>
        
        <p class="description">
            Experience an intense 3D first-person monster survival shooter game built for PC. 
            Defend yourself against waves of monsters, manage your 5 lives, and aim for the highest score!
        </p>

        <!-- DOWNLOAD BUTTON -->
        <button onclick="downloadGame()" class="download-btn">
            ⬇ DOWNLOAD GAME (.EXE)
        </button>

        <p class="info">Platform: Windows PC | Free Download</p>
    </div>

    <script>
        function downloadGame() {
            const a = document.createElement('a');
            a.href = GAME_DOWNLOAD_FILE;
            a.download = GAME_DOWNLOAD_FILE;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>

</body>
</html>
